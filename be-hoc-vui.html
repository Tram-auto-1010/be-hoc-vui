<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bé Học Vui</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: toy-box — chunky tab row on top, big tappable cards that press down like plastic buttons. Single bright look on purpose (for small kids). */
:root{
  --sky:#E6F2FA; --card:#FFFFFF; --ink:#1F2A44; --ink-soft:#56627E;
  --sun:#FFC83D; --tomato:#FF6B4A; --leaf:#34A86B; --grape:#7B5CD6; --sea:#2E8FD8;
  --edge:rgba(31,42,68,.16);
  --display:"Baloo 2","Nunito",system-ui,sans-serif;
  --body:"Nunito","Baloo 2",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--sky);color:var(--ink);font-family:var(--body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,46px);line-height:1;margin:0;letter-spacing:-.5px}
h1 span:nth-child(1){color:var(--tomato)} h1 span:nth-child(2){color:var(--sea)} h1 span:nth-child(3){color:var(--leaf)}
.sub{font-size:14px;color:var(--ink-soft);margin:4px 0 0}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;background:var(--card);border-radius:999px;padding:4px;box-shadow:0 3px 0 var(--edge)}
.seg button{font:800 14px var(--body);border:0;background:transparent;color:var(--ink-soft);padding:8px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px;padding:10px 12px 8px;border:0;border-radius:20px;background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--edge);font-family:var(--display);transition:transform .1s}
.tab .ic{font-size:30px;line-height:1}
.tab b{font-size:16px;font-weight:800;line-height:1.1}
.tab small{font:700 11px var(--body);color:var(--ink-soft)}
.tab[aria-selected="true"]{background:var(--sun);box-shadow:0 5px 0 #D9A21E}
.tab:active,.card:active,.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
:focus-visible{outline:4px solid var(--sea);outline-offset:3px}
.topic-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.topic-head h2{font-family:var(--display);font-size:28px;margin:0;line-height:1.1}
.topic-head p{margin:0;color:var(--ink-soft);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{position:relative;border:0;background:var(--card);border-radius:24px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;box-shadow:0 6px 0 var(--edge);color:var(--ink);font-family:var(--display);transition:transform .1s;min-width:0}
.pic{height:96px;display:grid;place-items:center;font-size:72px;line-height:1}
.vi{font-size:24px;font-weight:800;line-height:1.1}
.en{font:800 14px var(--body);color:var(--sea);letter-spacing:.3px;line-height:1.1}
.snd{font:700 12px var(--body);color:var(--ink-soft);font-style:italic}
.swatch{width:84px;height:84px;border-radius:50%;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12)}
.num{font-size:64px;font-weight:800;line-height:1;color:var(--grape)}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:20px;max-width:130px;min-height:26px}
.letter{font-size:64px;font-weight:800;line-height:1}
.letter i{font-style:normal;font-size:44px;color:var(--ink-soft);margin-left:4px}
.word mark{background:none;color:var(--tomato)}
.card.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08) rotate(-2deg)}100%{transform:scale(1)}}
/* quiz */
.quiz{background:var(--card);border-radius:28px;padding:20px;box-shadow:0 6px 0 var(--edge);display:flex;flex-direction:column;gap:18px;align-items:center}
.ask{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;text-align:center}
.ask .q{font-family:var(--display);font-size:clamp(24px,5vw,34px);font-weight:800;line-height:1.15;text-wrap:balance}
.ask .q small{display:block;font:800 16px var(--body);color:var(--sea)}
.round{border:0;width:52px;height:52px;border-radius:50%;background:var(--sea);color:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 0 #1F6AA6;flex:0 0 auto}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%;max-width:640px}
.opt{border:0;background:var(--sky);border-radius:24px;aspect-ratio:1;max-width:100%;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 0 var(--edge);font-family:var(--display);font-size:clamp(48px,12vw,84px);color:var(--ink);padding:8px}
.opt .swatch{width:70%;height:70%}
.opt svg{width:75%;height:75%}
.opt.right{background:#D6F3E3;box-shadow:0 6px 0 var(--leaf)}
.opt.wrong{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.praise{min-height:34px;font:800 20px var(--display);color:var(--leaf);text-align:center}
.score{font:800 14px var(--body);color:var(--ink-soft)}
.stars{color:var(--sun);letter-spacing:2px}
.note{font-size:13px;color:var(--ink-soft);background:var(--card);border-radius:14px;padding:10px 14px;line-height:1.5}
.note b{color:var(--ink)}
@media (max-width:440px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pic{height:80px;font-size:60px}.vi{font-size:20px}.opts{gap:10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1><span>Bé</span> <span>Học</span> <span>Vui</span></h1>
      <p class="sub">Chạm vào thẻ để nghe tiếng Việt và tiếng Anh · Tap a card to listen</p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Chế độ">
        <button id="m-learn" aria-pressed="true">Học</button>
        <button id="m-quiz" aria-pressed="false">Đố bé</button>
      </div>
      <div class="seg" role="group" aria-label="Giọng đọc">
        <button id="v-both" data-v="both" aria-pressed="true">Việt + Anh</button>
        <button id="v-vi" data-v="vi" aria-pressed="false">Việt</button>
        <button id="v-en" data-v="en" aria-pressed="false">English</button>
      </div>
    </div>
  </header>

  <nav class="tabs" role="tablist" id="tabs"></nav>

  <section id="stage" aria-live="polite"></section>

  <p class="note" id="voiceNote"><b>Mẹo cho ba mẹ:</b> Mỗi ngày chỉ cần 10–15 phút, ngồi cùng bé, chỉ vào thẻ và nói theo. Ở chế độ <b>Đố bé</b>, hãy để bé tự chạm, khen bé khi đúng.</p>
</div>

<script>
const SHAPE_COLORS=["#FF6B4A","#2E8FD8","#34A86B","#FFC83D","#7B5CD6","#FF7FB0","#FF9F1C","#00A6A6"];
const shapeSVG={
  circle:'<circle cx="50" cy="50" r="40"/>',
  square:'<rect x="12" y="12" width="76" height="76" rx="6"/>',
  triangle:'<path d="M50 10 L90 86 L10 86 Z" stroke-linejoin="round"/>',
  rect:'<rect x="6" y="26" width="88" height="48" rx="6"/>',
  star:'<path d="M50 6l12.3 27.6 30 3.1-22.5 20.1 6.4 29.5L50 71.2 23.8 86.3l6.4-29.5L7.7 36.7l30-3.1z"/>',
  heart:'<path d="M50 88S8 62 8 34a20 20 0 0 1 42-10 20 20 0 0 1 42 10c0 28-42 54-42 54z"/>',
  oval:'<ellipse cx="50" cy="50" rx="44" ry="30"/>',
  diamond:'<path d="M50 6 L88 50 L50 94 L12 50 Z"/>'
};
const svg=(k,i)=>`<svg viewBox="0 0 100 100" width="90" height="90" aria-hidden="true"><g fill="${SHAPE_COLORS[i%SHAPE_COLORS.length]}" stroke="rgba(0,0,0,.12)" stroke-width="3">${shapeSVG[k]}</g></svg>`;

const TOPICS=[
 {id:"mau",ic:"🎨",vi:"Màu sắc",en:"Colors",ask:["Đâu là màu","Where is"],
  items:[["đỏ","red","#E53935"],["cam","orange","#FB8C00"],["vàng","yellow","#FDD835"],["xanh lá","green","#43A047"],["xanh dương","blue","#1E88E5"],["tím","purple","#8E24AA"],["hồng","pink","#F48FB1"],["nâu","brown","#8D6E63"],["đen","black","#212121"],["trắng","white","#FFFFFF"]]
   .map(([vi,en,c])=>({vi,en,pic:`<div class="swatch" style="background:${c};${c==="#FFFFFF"?"outline:3px solid #DDE3EE":""}"></div>`}))},
 {id:"hinh",ic:"🔺",vi:"Hình khối",en:"Shapes",ask:["Đâu là","Where is the"],
  items:[["hình tròn","circle","circle"],["hình vuông","square","square"],["hình tam giác","triangle","triangle"],["hình chữ nhật","rectangle","rect"],["ngôi sao","star","star"],["trái tim","heart","heart"],["hình bầu dục","oval","oval"],["hình thoi","diamond","diamond"]]
   .map(([vi,en,k],i)=>({vi,en,pic:svg(k,i)}))},
 {id:"so",ic:"🔢",vi:"Số đếm",en:"Numbers",ask:["Đâu là số","Where is number"],
  items:["một","hai","ba","bốn","năm","sáu","bảy","tám","chín","mười"].map((vi,i)=>{
    const en=["one","two","three","four","five","six","seven","eight","nine","ten"][i];
    const thing=["🐥","🍎","⭐","🐟","🌸","🎈","🐞","🍓","🚗","🍪"][i];
    return {vi,en,n:i+1,thing,pic:`<div class="num">${i+1}</div>`,extra:`<div class="dots">${thing.repeat(i+1)}</div>`,quizPic:`${i+1}`};
  })},
 {id:"convat",ic:"🐶",vi:"Con vật",en:"Animals",ask:["Đâu là con","Where is the"],
  items:[["mèo","cat","🐱","meo meo"],["chó","dog","🐶","gâu gâu"],["gà","chicken","🐔","ò ó o"],["vịt","duck","🦆","cạp cạp"],["bò","cow","🐮","ụm bò"],["heo","pig","🐷","ụt ịt"],["voi","elephant","🐘",""],["khỉ","monkey","🐒","khẹc khẹc"],["sư tử","lion","🦁","gừ gừ"],["cá","fish","🐟",""],["thỏ","rabbit","🐰",""],["ngựa","horse","🐴","hí hí"]]
   .map(([vi,en,e,s])=>({vi,en,pic:e,snd:s}))},
 {id:"traicay",ic:"🍉",vi:"Trái cây",en:"Fruits",ask:["Đâu là quả","Where is the"],
  items:[["táo","apple","🍎"],["chuối","banana","🍌"],["cam","orange","🍊"],["nho","grapes","🍇"],["dưa hấu","watermelon","🍉"],["xoài","mango","🥭"],["dứa","pineapple","🍍"],["dâu tây","strawberry","🍓"],["lê","pear","🍐"],["đào","peach","🍑"],["dừa","coconut","🥥"],["chanh","lemon","🍋"]]
   .map(([vi,en,e])=>({vi,en,pic:e}))},
 {id:"chu",ic:"🔤",vi:"Chữ cái",en:"Letters",ask:["Đâu là chữ","Where is letter"],
  items:[["a","[á]o","shirt","👕"],["ă","[ă]n cơm","eat rice","🍚"],["â","[ấ]m trà","teapot","🫖"],["b","[b]óng","ball","⚽"],["c","[c]á","fish","🐟"],["d","[d]ê","goat","🐐"],["đ","[đ]èn","lamp","💡"],["e","[e]m bé","baby","👶"],["ê","[ế]ch","frog","🐸"],["g","[g]à","chicken","🐔"],["h","[h]oa","flower","🌸"],["i","kh[ỉ]","monkey","🐒"],["k","[k]em","ice cream","🍦"],["l","[l]á","leaf","🍃"],["m","[m]èo","cat","🐱"],["n","[n]ho","grapes","🍇"],["o","[o]ng","bee","🐝"],["ô","[ô]","umbrella","☂️"],["ơ","[ớ]t","chili","🌶️"],["p","[p]in","battery","🔋"],["q","[q]uà","gift","🎁"],["r","[r]ùa","turtle","🐢"],["s","[s]ao","star","⭐"],["t","[t]áo","apple","🍎"],["u","[ủ]ng","boots","👢"],["ư","s[ư] tử","lion","🦁"],["v","[v]oi","elephant","🐘"],["x","[x]e","car","🚗"],["y","[y] tá","nurse","🧑‍⚕️"]]
   .map(([l,w,en,e])=>{const plain=w.replace(/[\[\]]/g,"");return {vi:plain,letter:l,en,emoji:e,
     pic:`<div class="letter">${l.toUpperCase()}<i>${l}</i></div>`,
     word:`${e} <span class="word">${w.replace("[","<mark>").replace("]","</mark>")}</span>`,quizPic:l.toUpperCase()+l};})}
];

/* ---------- speech ---------- */
let voiceMode="both"; let viVoice=null, enVoice=null;
function pickVoices(){
  try{const vs=speechSynthesis.getVoices();
    viVoice=vs.find(v=>/^vi/i.test(v.lang))||null;
    enVoice=vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
    if(vs.length&&!viVoice){document.getElementById("voiceNote").insertAdjacentHTML("beforeend"," <br><b>Lưu ý:</b> Máy này chưa có giọng đọc tiếng Việt, nên phần tiếng Việt có thể đọc sai. Bạn có thể cài giọng Tiếng Việt trong phần Cài đặt › Trợ năng › Nội dung được đọc của điện thoại/máy tính.");}
  }catch(e){}
}
if("speechSynthesis" in window){pickVoices();speechSynthesis.onvoiceschanged=pickVoices;}
function utter(text,lang){const u=new SpeechSynthesisUtterance(text);u.lang=lang==="vi"?"vi-VN":"en-US";const v=lang==="vi"?viVoice:enVoice;if(v)u.voice=v;u.rate=lang==="vi"?.85:.8;u.pitch=1.15;return u;}
function say(vi,en){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  if(voiceMode!=="en"&&vi)speechSynthesis.speak(utter(vi,"vi"));
  if(voiceMode!=="vi"&&en)speechSynthesis.speak(utter(en,"en"));
}

/* ---------- state ---------- */
let topic=TOPICS[0], mode="learn", quizState=null;
try{const s=JSON.parse(localStorage.getItem("bhv")||"{}");if(s.t)topic=TOPICS.find(t=>t.id===s.t)||topic;if(s.v)voiceMode=s.v;}catch(e){}
const save=()=>{try{localStorage.setItem("bhv",JSON.stringify({t:topic.id,v:voiceMode}))}catch(e){}};

const tabsEl=document.getElementById("tabs"), stage=document.getElementById("stage");
function renderTabs(){
  tabsEl.innerHTML=TOPICS.map(t=>`<button class="tab" role="tab" id="tab-${t.id}" aria-selected="${t===topic}" data-id="${t.id}"><span class="ic" aria-hidden="true">${t.ic}</span><b>${t.vi}</b><small>${t.en}</small></button>`).join("");
}
tabsEl.addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;topic=TOPICS.find(t=>t.id===b.dataset.id);save();renderTabs();render();say(topic.vi,topic.en);});

function speakItem(it){
  if(topic.id==="chu")return say(`chữ ${it.letter}. ${it.vi}`,it.en);
  if(topic.id==="convat"&&it.snd)return say(`con ${it.vi}. ${it.snd}`,it.en);
  if(topic.id==="traicay")return say(`quả ${it.vi}`,it.en);
  if(topic.id==="mau")return say(`màu ${it.vi}`,it.en);
  return say(it.vi,it.en);
}

function render(){
  if(mode==="learn"){
    stage.innerHTML=`<div class="topic-head"><h2>${topic.vi}</h2><p>${topic.en} · ${topic.items.length} thẻ</p></div>
    <div class="grid" style="margin-top:12px">${topic.items.map((it,i)=>`
      <button class="card" data-i="${i}" id="card-${topic.id}-${i}">
        <div class="pic">${it.pic}</div>
        ${it.extra||""}
        ${it.word?`<div class="vi" style="font-size:20px">${it.word}</div>`:`<div class="vi">${it.vi}</div>`}
        <div class="en">${it.en}</div>
        ${it.snd?`<div class="snd">“${it.snd}”</div>`:""}
      </button>`).join("")}</div>`;
  } else { newQuestion(); }
}
stage.addEventListener("click",e=>{
  const c=e.target.closest(".card");
  if(c){const it=topic.items[+c.dataset.i];speakItem(it);c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");return;}
  const o=e.target.closest(".opt");
  if(o&&quizState&&!quizState.done){answer(o);return;}
  if(e.target.closest("#replay"))askAloud();
  if(e.target.closest("#next"))newQuestion();
});

/* ---------- quiz ---------- */
let score=0, total=0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function quizLabel(it){return topic.id==="chu"?it.letter:it.vi;}
function askAloud(){const it=quizState.target;say(`${topic.ask[0]} ${quizLabel(it)}?`,`${topic.ask[1]} ${it.en}?`);}
function newQuestion(){
  const opts=shuffle(topic.items).slice(0,3);
  const target=opts[Math.floor(Math.random()*3)];
  quizState={opts,target,done:false,tries:0};
  stage.innerHTML=`<div class="quiz">
    <div class="ask"><button class="round" id="replay" aria-label="Nghe lại câu hỏi">🔊</button>
      <div class="q">${topic.ask[0]} ${quizLabel(target)}?<small>${topic.ask[1]} ${target.en}?</small></div></div>
    <div class="opts">${opts.map((it,i)=>`<button class="opt" data-i="${i}" id="opt-${i}" aria-label="Lựa chọn ${i+1}">${it.quizPic||it.pic}</button>`).join("")}</div>
    <div class="praise" id="praise"></div>
    <div class="score">Bé đã đúng <b>${score}</b> / ${total} câu <span class="stars">${"★".repeat(Math.min(score,10))}</span></div>
  </div>`;
  setTimeout(askAloud,150);
}
function answer(btn){
  const it=quizState.opts[+btn.dataset.i];const p=document.getElementById("praise");
  if(it===quizState.target){
    quizState.done=true;btn.classList.add("right");total++;if(quizState.tries===0)score++;
    const cheers=[["Giỏi quá!","Great job!"],["Đúng rồi!","That's right!"],["Bé thật giỏi!","Well done!"]];const c=cheers[Math.floor(Math.random()*cheers.length)];
    p.innerHTML=`${c[0]} ${c[1]} <button class="round" id="next" aria-label="Câu tiếp theo" style="width:44px;height:44px;font-size:20px;vertical-align:middle;margin-left:8px;background:var(--leaf);box-shadow:0 4px 0 #23784B">➜</button>`;
    p.style.color="var(--leaf)";say(c[0],c[1]);
    const qs=quizState;setTimeout(()=>{if(quizState===qs&&mode==="quiz")newQuestion();},2600);
  } else {
    quizState.tries++;btn.classList.remove("wrong");void btn.offsetWidth;btn.classList.add("wrong");
    p.textContent="Chưa đúng, bé thử lại nhé! Try again!";p.style.color="var(--tomato)";
    say("Bé thử lại nhé","Try again");
  }
}

/* ---------- controls ---------- */
function setMode(m){mode=m;document.getElementById("m-learn").setAttribute("aria-pressed",m==="learn");document.getElementById("m-quiz").setAttribute("aria-pressed",m==="quiz");render();}
document.getElementById("m-learn").onclick=()=>setMode("learn");
document.getElementById("m-quiz").onclick=()=>setMode("quiz");
document.querySelectorAll("[data-v]").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.v===voiceMode);b.onclick=()=>{voiceMode=b.dataset.v;save();document.querySelectorAll("[data-v]").forEach(x=>x.setAttribute("aria-pressed",x===b));say("Xin chào","Hello");};});

renderTabs();render();
</script>
