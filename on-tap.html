<!doctype html>
<html lang="vi" data-nowemo>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Let's Review! · Ôn tập hỏi đáp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;800&display=swap">
<style>
:root{--ink:#1F2A44;--muted:#56627E;--bg:#FFF8EE;--card:#FFFFFF;--line:#E3E8F1;--red:#E5533A;--blue:#2E8FD8;--green:#2E9E5B;--yellow:#F2B705;--purple:#7B5CD6;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
.bar{display:flex;align-items:center;gap:14px;padding:12px 20px;background:#FFFFFF;border-bottom:3px solid var(--line);position:sticky;top:0;z-index:5}
.bar h1{margin:0;flex:1;font:800 clamp(22px,3.4vw,34px)/1.1 'Baloo 2',sans-serif}
.bar h1 small{display:block;font:800 14px 'Nunito',sans-serif;color:var(--blue)}
.ibtn{width:56px;height:56px;border-radius:18px;border:3px solid var(--line);background:#FFFFFF;font-size:28px;display:grid;place-items:center;cursor:pointer;text-decoration:none;color:inherit;flex-shrink:0}
.ibtn:hover{border-color:#B7C0D2}
.ibtn.off{opacity:.45}
.btn{font:800 20px 'Baloo 2',sans-serif;border:none;border-radius:18px;padding:10px 22px;cursor:pointer;background:var(--blue);color:#FFFFFF;box-shadow:0 5px 0 rgba(31,42,68,.18)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(31,42,68,.18)}
.btn.ghost{background:#FFFFFF;color:var(--ink);border:3px solid var(--line);box-shadow:none}
.btn.on{background:var(--purple);color:#FFFFFF;border-color:var(--purple)}
main{max-width:1100px;margin:0 auto;padding:20px}
.stars{font:800 22px 'Baloo 2',sans-serif;white-space:nowrap}
@keyframes pop{0%{transform:scale(.5);opacity:0}55%{transform:scale(1.1);opacity:1}75%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translate3d(0,0,0)}15%{transform:translate3d(-9px,0,0) rotate(-2deg)}35%{transform:translate3d(7px,0,0) rotate(1.5deg)}55%{transform:translate3d(-4px,0,0)}75%{transform:translate3d(2px,0,0)}}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0)}25%{transform:translate3d(18px,28vh,0) rotate(140deg)}50%{transform:translate3d(-14px,56vh,0) rotate(280deg)}75%{transform:translate3d(12px,84vh,0) rotate(420deg)}100%{transform:translate3d(0,112vh,0) rotate(540deg);opacity:.9}}
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97) both}
button,.btn,.opt,.num,.lt,.game,.thumb,.sw,.k,.an,.pc,.fd,.slot,.zone,.t,.stone,.hole,.nest,.egg{transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,background-color .25s ease,border-color .25s ease,opacity .25s ease;-webkit-tap-highlight-color:transparent}
.btn:hover,.opt:hover,.num:hover,.lt:hover{transform:translateY(-2px)}
.btn:active,.opt:active,.num:active,.lt:active,.sw:active{transform:scale(.94)}
.ok,.done{animation:okpop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes okpop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.confetti,.fx,.fxplus,.fxno,.mascot,.walk,.bl,.fish,.it,.dodo .d{will-change:transform}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.confetti{position:fixed;top:-60px;font-size:38px;pointer-events:none;z-index:50;animation:fall 2.6s cubic-bezier(.45,.05,.55,.95) forwards}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:#FFFFFF;border:4px solid var(--yellow);border-radius:28px;padding:22px 34px;font:800 clamp(28px,5vw,48px)/1.1 'Baloo 2',sans-serif;text-align:center;z-index:60;animation:pop .4s;box-shadow:0 18px 40px rgba(31,42,68,.18)}
.toast .btn{margin-top:14px}
.fx{position:fixed;z-index:70;pointer-events:none;font-size:30px;line-height:1;animation:fxfly .95s cubic-bezier(.17,.84,.44,1) forwards}
@keyframes fxfly{0%{transform:translate3d(-50%,-50%,0) scale(.3);opacity:1}70%{opacity:1}100%{transform:translate3d(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 30px),0) scale(1) rotate(var(--r));opacity:0}}
.fxplus{position:fixed;z-index:71;pointer-events:none;font:800 34px 'Baloo 2',sans-serif;color:#F2B705;text-shadow:0 3px 0 #FFFFFF,0 0 12px rgba(242,183,5,.6);animation:fxup 1s ease-out forwards}
@keyframes fxup{0%{transform:translate(-50%,-30%) scale(.6);opacity:0}25%{opacity:1;transform:translate(-50%,-80%) scale(1.15)}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}
.fxno{position:fixed;z-index:71;pointer-events:none;font-size:46px;animation:fxwob .8s ease-out forwards}
@keyframes fxwob{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}30%{transform:translate(-50%,-90%) scale(1.15) rotate(-12deg);opacity:1}60%{transform:translate(-50%,-90%) rotate(12deg)}100%{transform:translate(-50%,-120%) scale(.9);opacity:0}}
.mascot{position:fixed;left:50%;bottom:-200px;z-index:65;font-size:clamp(110px,18vw,180px);line-height:1;pointer-events:none;animation:mascot 2.4s cubic-bezier(.3,1.4,.5,1) forwards;filter:drop-shadow(0 10px 18px rgba(31,42,68,.25))}
@keyframes mascot{0%{transform:translateX(-50%) translateY(0)}25%{transform:translateX(-50%) translateY(-320px) rotate(-8deg)}40%{transform:translateX(-50%) translateY(-280px) rotate(8deg)}55%{transform:translateX(-50%) translateY(-320px) rotate(-6deg)}80%{transform:translateX(-50%) translateY(-300px)}100%{transform:translateX(-50%) translateY(0)}}
.flashok{animation:flashok .5s}
@keyframes flashok{0%{box-shadow:0 0 0 0 rgba(46,158,91,.7)}100%{box-shadow:0 0 0 26px rgba(46,158,91,0)}}
/* ===== Chủ đề khủng long ===== */
:root{--bg:#F1F8E9;--line:#D6E9C9}
main,.hero,.sec,.note,.top{position:relative;z-index:1}
main{min-width:0;overflow-x:clip}
body{background:radial-gradient(circle at 12% 18%,rgba(255,241,170,.55) 0 120px,transparent 121px),radial-gradient(circle at 88% 10%,rgba(200,230,201,.7) 0 160px,transparent 161px),linear-gradient(#EAF6E2,#F6FBEF 60%,#E6F2D8);background-attachment:fixed;padding-bottom:110px}
.bar{background:linear-gradient(90deg,#43A047,#7CB342);border-bottom:4px solid #2E7D32;color:#FFFFFF}
.bar h1{color:#FFFFFF;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.bar h1::before{content:'🦕 ';}
html.dimg .bar h1::before{content:'';display:inline-block;width:1.15em;height:1.15em;background:var(--dinoimg) center/contain no-repeat;margin-right:.3em;vertical-align:-.18em}
.bar h1 small{color:#FFF59D}
.bar .ibtn{border-color:#A5D6A7}
.jungle{position:fixed;left:0;right:0;bottom:0;height:80px;pointer-events:none;z-index:0;opacity:.85;overflow:hidden;background:linear-gradient(transparent,rgba(124,179,66,.35));font-size:44px;line-height:1}
.jungle span{position:absolute;bottom:4px}
.jungle .walk{animation:walk 26s linear infinite}
.jungle .walk.b{animation-duration:34s;animation-delay:-14s;font-size:34px}
@keyframes walk{from{transform:translate3d(-90px,0,0) scaleX(-1)}to{transform:translate3d(calc(100vw + 20px),0,0) scaleX(-1)}}
.jungle .walk{left:0}
.dodo{position:fixed;right:14px;bottom:10px;z-index:60;display:flex;align-items:flex-end;gap:6px;pointer-events:none}
.dodo .d{font-size:clamp(60px,8vw,86px);line-height:1;transform-origin:bottom center;animation:breathe 2.6s ease-in-out infinite}
.dodo .bub{background:#FFFFFF;border:3px solid #43A047;border-radius:20px 20px 4px 20px;padding:8px 14px;font:800 20px 'Baloo 2',sans-serif;color:#2E7D32;opacity:0;transform:translateY(10px) scale(.8);transition:all .25s;margin-bottom:56px;white-space:nowrap}
.dodo.say .bub{opacity:1;transform:none}
.dodo.happy .d{animation:jump .6s ease 2}
.dodo.sad .d{animation:wob .5s ease 2}
.dodo.sad .bub{border-color:#FB8C00;color:#E65100}
@keyframes breathe{50%{transform:scale(1.04,.97)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-38px) rotate(-8deg)}}
@keyframes wob{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
#langBtn{white-space:nowrap}
.bar h1{min-width:0}
@media (max-width:600px){.bar{padding:8px 10px;gap:8px}.bar .ibtn{width:46px;height:46px;font-size:23px;border-radius:15px}.bar h1{font-size:19px;line-height:1.15}.bar h1::before{content:''}.bar h1 small{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}main{padding:14px 12px}}
@media (max-width:760px){#langBtn .lt-name{display:none}.dodo{opacity:0;transition:opacity .2s}.dodo.say{opacity:1}.dodo .d{font-size:54px}.dodo .bub{font-size:16px;margin-bottom:36px}.jungle{height:56px;font-size:28px}body{padding-bottom:70px}}
@media (max-height:800px){.jungle{height:60px;font-size:32px}}
img.emo{display:inline-block;width:1.15em;height:1.15em;max-width:100%;vertical-align:-.2em;object-fit:contain;pointer-events:none;-webkit-user-drag:none;user-select:none}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}.tabs .btn{font-size:16px;padding:7px 13px}.tabs .stars{margin-left:auto}
.title{text-align:center;margin:2px 0 12px}
.title b{display:inline-block;font:800 clamp(28px,5vw,46px)/1 'Baloo 2',sans-serif;color:#1A2A5A;background:#F8BBD0;border:4px solid #F48FB1;border-radius:999px;padding:6px 28px}
.title small{display:block;font:800 15px 'Nunito',sans-serif;color:var(--muted);margin-top:6px}
.sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:1000px;margin:0 auto}
.qc{position:relative;display:flex;align-items:center;gap:10px;border:3px solid #F8BBD0;background:#FFFFFF;border-radius:20px;padding:8px 10px 8px 12px;cursor:pointer;text-align:left;font:inherit;min-height:clamp(96px,14vw,140px);transition:transform .15s}
.qc:hover{transform:translateY(-3px)}
.qc .no{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#FFFFFF;font:800 22px 'Baloo 2',sans-serif;background:var(--c)}
.qc .qt{flex:1;font:800 clamp(17px,2.4vw,24px)/1.2 'Baloo 2',sans-serif;color:#1A2A5A}
.qc .qp{flex:0 0 auto;height:clamp(80px,12vw,124px);max-width:46%;display:flex;gap:2px;align-items:flex-end}
.qc .qp img{height:100%;width:auto;max-width:100%;object-fit:contain}
.qc.done:after{content:'✓';position:absolute;top:-10px;right:-8px;width:34px;height:34px;border-radius:50%;background:#43A047;color:#FFFFFF;display:grid;place-items:center;font:800 20px 'Nunito',sans-serif;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.words{max-width:1000px;margin:14px auto 0;background:#E3F2FD;border:3px solid #90CAF9;border-radius:20px;padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.words b{font:800 15px 'Nunito',sans-serif;color:#FFFFFF;background:#1A2A5A;border-radius:999px;padding:3px 12px}
.words button{border:none;background:#FFFFFF;border-radius:999px;padding:4px 12px;font:800 clamp(15px,2vw,19px) 'Baloo 2',sans-serif;color:#1A2A5A;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.1)}
/* question view */
.qv{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:20px;align-items:start;max-width:1000px;margin:0 auto}
.qv .pic{background:#FFFFFF;border:4px solid #F8BBD0;border-radius:26px;padding:10px;display:flex;justify-content:center;align-items:flex-end;gap:8px;height:min(52svh,400px);position:relative}
.qv .pic img{max-height:100%;max-width:100%;object-fit:contain}
.qv .pic .one{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;flex:1}
.qv .pic .one.pt:before{content:'👇';position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:40px;animation:bob 1s infinite;z-index:2}
@keyframes bob{50%{transform:translate(-50%,-8px)}}
.qv .head{display:flex;align-items:center;gap:10px;cursor:pointer}
.qv .head .no{flex:0 0 auto;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#FFFFFF;font:800 26px 'Baloo 2',sans-serif;background:var(--c)}
.qv .head .qt{font:800 clamp(24px,3.8vw,36px)/1.15 'Baloo 2',sans-serif;color:#1A2A5A}
.qv .head .qt small{display:block;font:800 14px 'Nunito',sans-serif;color:var(--muted)}
.ans{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.ans .btn{font-size:clamp(19px,2.8vw,26px);padding:8px 12px;text-align:left;line-height:1.15}
.ans .btn.ok{background:#43A047;color:#FFFFFF}
.ans .btn.ok small{color:#FFFFFF}
.oi2{flex:0 0 auto;width:clamp(56px,8vw,80px);height:clamp(56px,8vw,80px);border-radius:14px;background:#FFFFFF;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 2px #E3E8F1;font-size:40px;gap:1px}
.oi2 img{max-height:100%;max-width:100%;object-fit:contain}.oi2.two img{max-width:50%}
.oi2.y{background:#E8F5E9;align-items:center}.oi2.n{background:#FFEBEE;align-items:center}
.oi2.num{flex-direction:column;align-items:center;justify-content:center;line-height:1}.oi2.num b{font:800 34px 'Baloo 2',sans-serif;color:#FB8C00}.oi2.num i{font-style:normal;font-size:10px;color:#FB8C00}
.ansrow{display:flex;align-items:center;gap:12px}.ansrow .t{flex:1}.ansrow small{display:block;font:800 13px 'Nunito',sans-serif;color:var(--muted)}
.prog{display:flex;gap:6px;justify-content:center;margin:12px 0 0;flex-wrap:wrap}
.prog i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 14px 'Nunito',sans-serif;font-style:normal;background:#ECEFF4;color:#5A6478;cursor:pointer}
.prog i.d{background:#43A047;color:#FFFFFF}.prog i.c{box-shadow:0 0 0 3px #FB8C00}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:12px}

.ruler{display:flex;align-items:flex-end;gap:10px;height:100%;justify-content:center}
.ruler .who{height:var(--h);display:flex;align-items:flex-end}.ruler .who img{height:100%;width:auto;max-width:none}
.ruler .rl{height:100%;width:26px;border-radius:6px;background:repeating-linear-gradient(to top,#F9D27A 0 9px,#B07A1A 9px 11px),#F9D27A;box-shadow:inset 0 0 0 2px #B07A1A;position:relative}
.ruler .rl i{position:absolute;left:-6px;right:-6px;bottom:var(--h);height:4px;background:#E53935;border-radius:2px}
.crowd{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:4px;height:100%;align-content:center}
.crowd img{height:46%;width:auto;max-width:31%}
.score{max-width:640px;margin:20px auto;text-align:center;background:#FFFFFF;border-radius:26px;padding:22px;box-shadow:0 6px 0 rgba(31,42,68,.1);font:800 24px 'Baloo 2',sans-serif}
.score big{display:block;font-size:60px;color:#FB8C00}
#kinds[hidden]{display:none}#kinds .btn{font-size:14px;padding:5px 11px}
@media (max-width:640px){#kinds{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}#kinds .btn{flex-shrink:0}}
@media (max-width:700px){.sheet{grid-template-columns:1fr;gap:10px}.qv{grid-template-columns:1fr;gap:10px}.qv .pic{height:min(34svh,250px)}}
</style>

<script>
const VOICE_KEY='bhv-voice';
let voiceOn=true;try{voiceOn=localStorage.getItem(VOICE_KEY)!=='0'}catch(e){}
/* ===== Giọng đọc: chọn giọng hay nhất + giọng ba mẹ thu sẵn ===== */
const VSET_KEY='bhv-voiceset';let VS={vi:'',en:'',pitch:1.3,rate:.88,mode:'mix',lang:'vi'};try{Object.assign(VS,JSON.parse(localStorage.getItem(VSET_KEY)||'{}'))}catch(e){}
const NICE=/Natural|Online|Neural|Premium|Enhanced|HoaiMy|Hoài|NamMinh|Linh|Google|Siri|Samantha|Jenny|Aria|Ana/i;
function voicesFor(lang){if(!('speechSynthesis' in window))return [];return speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().replace('_','-').startsWith(lang))}
const NOVELTY=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Grandma|Grandpa|Rocko|Shelley|Flo|Eddy|Reed|Sandy/i;
function enScore(v){const l=(v.lang||'').toLowerCase().replace('_','-'),n=v.name;const acc=VS.enAcc||'us';let s=0;
  if(NOVELTY.test(n))s-=200;
  if(l==='en-us')s+=100;else if(l==='en-gb')s-=40;else s-=60;
  if(/Natural|Neural/i.test(n))s+=70;if(/Online/i.test(n))s+=40;if(/Premium|Enhanced/i.test(n))s+=45;
  if(/Google US English/i.test(n))s+=50;
  if(/Jenny|Aria|Ava|Emma|Ana|Michelle|Sonia|Libby|Samantha|Allison|Susan|Serena|Kate|Zira/i.test(n))s+=20;
  if(v.localService===false)s-=60;return s}
function rankedEn(){return voicesFor('en').slice().sort((a,b)=>enScore(b)-enScore(a))}
function pickVoice(lang){const vs=voicesFor(lang);const chosen=vs.find(v=>v.name===VS[lang]&&(lang!=='en'||/en.us/i.test(v.lang)));if(chosen)return chosen;
  if(lang==='en')return rankedEn()[0]||null;
  return vs.find(v=>/Natural|Online|Neural|Premium|Enhanced/i.test(v.name))||vs.find(v=>NICE.test(v.name))||vs[0]||null}
function enFix(t){return t.replace(/T-rex/gi,'tee rex').replace(/\bxylophone\b/,'xylophone').replace(/\s+/g,' ')}
if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}
/* clips recorded by parents: stored in IndexedDB */
const REC={khen:[],dong:[],xong:[],chao:[]};let _aud=null;
function recDB(){return new Promise((ok,no)=>{try{const r=indexedDB.open('be-hoc-vui-giong',1);r.onupgradeneeded=()=>r.result.createObjectStore('clips');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}})}
function recLoad(){return recDB().then(db=>new Promise(ok=>{const t=db.transaction('clips').objectStore('clips');const q=t.openCursor();Object.keys(REC).forEach(k=>REC[k]=[]);

const kEl=document.getElementById('kinds');
['all',...Object.keys(G)].forEach(k=>{const b=document.createElement('button');b.className='btn'+(k==='all'?'':' ghost');b.textContent=KL[k];b.onclick=()=>{kinds=k==='all'?Object.keys(G):[k];kEl.querySelectorAll('.btn').forEach(x=>x.className='btn'+(x===b?'':' ghost'));lastKey='';practice()};kEl.appendChild(b)});
function setTab(m){mode=m;['tSheet','tPrac','tTest'].forEach(id=>document.getElementById(id).className='btn ghost');document.getElementById({sheet:'tSheet',prac:'tPrac',test:'tTest'}[m]).className='btn';kEl.hidden=m!=='prac'}
document.getElementById('tPrac').onclick=()=>{setTab('prac');practice()};
document.getElementById('tTest').onclick=()=>{setTab('test');test={i:0,ok:0,first:true};testQ()};
function practice(){render(genQ(),{label:'🎲',onNext:practice})}
function testQ(){if(test.i>=10){return testEnd()}test.first=true;render(genQ(),{label:(test.i+1)+'/10',onNext:()=>{test.i++;testQ()},onWrong:()=>{test.first=false},onRight:()=>{if(test.first)test.ok++}})}
function testEnd(){fstop();const n=test.ok;if(n>=7)confetti();stage.innerHTML='<div class="score">Bé trả lời đúng ngay lần đầu<big>'+n+' / 10</big>'+(n>=9?'🏆 Xuất sắc!':n>=7?'🌟 Giỏi lắm!':n>=5?'👍 Khá lắm!':'💪 Cố lên nhé!')+'<div style="margin-top:14px"><button class="btn" id="again">🔄 Làm bài mới</button></div></div>';
  sayEN(n>=7?'Great job! '+FNUM[n]+' out of ten!':'Good try! Let\'s practice more!',n>=7?'Bé giỏi lắm!':'Mình luyện thêm nhé!');document.getElementById('again').onclick=()=>{test={i:0,ok:0,first:true};testQ()}}
const WORDS=['father','mother','sister','brother','family','grandmother','grandfather','baby','young','old','tall','short'];
let stars=0,done=new Set(),cur=0,run=false,busy=false;
try{done=new Set(JSON.parse(localStorage.getItem('revDone')||'[]'))}catch(e){}
const saveDone=()=>{try{localStorage.setItem('revDone',JSON.stringify([...done]))}catch(e){}};
const stage=document.getElementById('stage');
const addPts=n=>{stars+=n;document.getElementById('stat').textContent='⭐ '+stars};
function tab(r){run=r;setTab('sheet')}
document.getElementById('tSheet').onclick=()=>{tab(false);sheet()};

function sheet(){fstop();
  stage.innerHTML='<div class="title"><b>Let’s Review!</b><small>Look at the pictures and answer the questions. · Chạm vào từng câu nhé!</small><div style="margin-top:8px"><button class="btn" id="runAll">▶️ Làm lần lượt 1 → 10</button></div></div><div class="sheet">'+Q.map((x,i)=>'<button class="qc'+(done.has(i)?' done':'')+'" data-i="'+i+'" style="--c:'+COLS[i]+'"><span class="no">'+(i+1)+'</span><span class="qt">'+x.q+'</span><span class="qp">'+x.sheet.map(IMG).join('')+'</span></button>').join('')+'</div>'
   +'<div class="words"><b>Useful Words:</b>'+WORDS.map(w=>'<button>'+w+'</button>').join('')+'</div>';
  document.getElementById('runAll').onclick=()=>{run=true;show(0)};
  stage.querySelectorAll('.qc').forEach(b=>b.onclick=()=>{run=false;show(+b.dataset.i)});
  stage.querySelectorAll('.words button').forEach(b=>b.onclick=()=>{fstop();sayEN(b.textContent)});
  FT(()=>sayEN('Let\'s review! Look at the pictures and answer the questions.','Bé nhìn tranh và trả lời câu hỏi nhé!'),90)}
function show(i){render(Q[i].build(),{idx:i})}
function render(b,ctx){fstop();busy=false;const i=ctx.idx;const sample=i!==undefined;const col=sample?COLS[i]:pick(COLS);
  const picHTML=b.ruler?'<div class="ruler" style="--h:'+P[b.ruler].hp+'%"><span class="who">'+IMG(P[b.ruler].img)+'</span><span class="rl"><i></i></span></div>':b.crowd?'<div class="crowd">'+b.crowd.map(k=>IMG(P[k].img)).join('')+'</div>':b.pics.map(([k,pt])=>'<span class="one'+(pt?' pt':'')+'">'+IMG(k)+'</span>').join('');
  stage.innerHTML='<div class="qv" style="--c:'+col+'"><div class="pic">'+picHTML+'</div>'
   +'<div><div class="head" id="hd"><span class="no">'+(sample?(i+1):ctx.label)+'</span><span class="qt">'+b.q+'<small>'+b.qv+' · 🔈 chạm để nghe lại</small></span></div><div class="ans" id="ans"></div><div id="spk"></div>'
   +(sample?'<div class="nav"><button class="btn ghost" id="bk">'+(run?'◀ Câu trước':'📋 Về phiếu')+'</button><button class="btn ghost" id="nx">'+(i<9?'Câu sau ▶':'🏁 Xong')+'</button></div>':'<div class="nav"><span></span><button class="btn ghost" id="nx">Bỏ qua ⏭️</button></div>')+'</div></div>'
   +(sample?'<div class="prog">'+Q.map((_,k)=>'<i class="'+(done.has(k)?'d ':'')+(k===i?'c':'')+'" data-k="'+k+'">'+(k+1)+'</i>').join('')+'</div>':'');
  const goNext=sample?()=>{i<9?show(i+1):finish()}:ctx.onNext;
  const ask=()=>{fstop();sayEN(b.q,b.qv)};document.getElementById('hd').onclick=ask;
  stage.querySelectorAll('.prog i').forEach(x=>x.onclick=()=>show(+x.dataset.k));
  if(sample)document.getElementById('bk').onclick=()=>run?show(Math.max(0,i-1)):sheet();
  document.getElementById('nx').onclick=goNext;
  const a=document.getElementById('ans');
  shuffle(b.opts.slice()).forEach(o=>{const bt=document.createElement('button');bt.className='btn ghost';bt.innerHTML='<span class="ansrow">'+o.ic+'<span class="t">'+o.en+'<small>'+o.vi+'</small></span></span>';
    bt.onclick=()=>{if(busy){if(o.ok){fstop();sayEN(o.full||o.en)}return}
      if(o.ok){busy=true;bt.classList.add('ok');good(bt);addPts(1);a.querySelectorAll('.btn:not(.ok)').forEach(x=>x.remove());ctx.onRight&&ctx.onRight();
        if(sample){done.add(i);saveDone();stage.querySelectorAll('.prog i')[i].classList.add('d')}fstop();sayEN(b.q+' '+(o.full||o.en),o.vi);
        speakPanel(document.getElementById('spk'),o.full||o.en,o.vi,{next:goNext,onScore:addPts})}
      else{ctx.onWrong&&ctx.onWrong();bt.classList.remove('shake');void bt.offsetWidth;bt.classList.add('shake');bad(bt);fstop();sayEN(o.en+' Hmm, look again! '+b.q)}};a.appendChild(bt)});
  FT(ask,90)}
function finish(){fstop();confetti();const all=done.size>=10;sayEN(all?'Great job! You finished the review!':'Good work! Let\'s try the other questions too!',all?'Bé đã làm xong phiếu ôn tập! Giỏi quá!':'Bé làm tiếp những câu còn lại nhé!');
  const t=toast((all?'🏆 Bé làm xong cả 10 câu!':'⭐ Bé đã làm '+done.size+'/10 câu')+'<br><button class="btn">📋 Về phiếu</button> <button class="btn ghost">🔄 Làm lại</button>');
  const bs=t.querySelectorAll('.btn');bs[0].onclick=()=>{t.remove();tab(false);sheet()};bs[1].onclick=()=>{t.remove();done=new Set();saveDone();run=true;setTab('sheet');show(0)}}
sheet();
</script>
</body>
</html>
