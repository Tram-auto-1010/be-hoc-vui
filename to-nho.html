@keyframes fxfly{0%{transform:translate3d(-50%,-50%,0) scale(.3);opacity:1}70%{opacity:1}100%{transform:translate3d(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 30px),0) scale(1) rotate(var(--r));opacity:0}}

<body>
<header class="bar"><a class="ibtn" href="index.html" title="Về trang chính">🏠</a><h1>To – nhỏ, nhiều – ít <small>Big or small, more or fewer</small></h1><button class="ibtn" id="voiceBtn">🔊</button></header>
<main>
  <div class="top"><span class="stars" id="stat"></span></div>
  <div class="msg"><div><span id="qv"></span><small id="qe"></small></div><button class="ibtn" id="again">🔈</button></div>
  <div class="opts" id="opts"></div>
</main>
<script>
const VOICE_KEY='bhv-voice';
let voiceOn=true;try{voiceOn=localStorage.getItem(VOICE_KEY)!=='0'}catch(e){}
/* ===== Giọng đọc: chọn giọng hay nhất + giọng ba mẹ thu sẵn ===== */
const VSET_KEY='bhv-voiceset';let VS={vi:'',en:'',pitch:1.3,rate:.88,mode:'mix',lang:'vi'};try{Object.assign(VS,JSON.parse(localStorage.getItem(VSET_KEY)||'{}'))}catch(e){}
const NICE=/Natural|Online|Neural|Premium|Enhanced|HoaiMy|Hoài|NamMinh|Linh|Google|Siri|Samantha|Jenny|Aria|Ana/i;
function voicesFor(lang){if(!('speechSynthesis' in window))return [];return speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().replace('_','-').startsWith(lang))}
const NOVELTY=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Grandma|Grandpa|Rocko|Shelley|Flo|Eddy|Reed|Sandy/i;
function enScore(v){const l=(v.lang||'').toLowerCase().replace('_','-'),n=v.name;const acc=VS.enAcc||'us';let s=0;
  if(NOVELTY.test(n))s-=200;
  if(l==='en-us')s+=100;else if(l==='en-gb')s-=40;else s-=60;
  if(/Natural|Neural/i.test(n))s+=70;if(/Online/i.test(n))s+=40;if(/Premium|Enhanced/i.test(n))s+=45;
  if(/Google US English/i.test(n))s+=50;
  if(/Jenny|Aria|Ava|Emma|Ana|Michelle|Sonia|Libby|Samantha|Allison|Susan|Serena|Kate|Zira/i.test(n))s+=20;
  if(v.localService===false)s+=5;return s}
function rankedEn(){return voicesFor('en').slice().sort((a,b)=>enScore(b)-enScore(a))}
function pickVoice(lang){const vs=voicesFor(lang);const chosen=vs.find(v=>v.name===VS[lang]&&(lang!=='en'||/en.us/i.test(v.lang)));if(chosen)return chosen;
  if(lang==='en')return rankedEn()[0]||null;
  return vs.find(v=>/Natural|Online|Neural|Premium|Enhanced/i.test(v.name))||vs.find(v=>NICE.test(v.name))||vs[0]||null}
function enFix(t){return t.replace(/T-rex/gi,'tee rex').replace(/\bxylophone\b/,'xylophone').replace(/\s+/g,' ')}
if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}
/* clips recorded by parents: stored in IndexedDB */
const REC={khen:[],dong:[],xong:[],chao:[]};let _aud=null;
function recDB(){return new Promise((ok,no)=>{try{const r=indexedDB.open('be-hoc-vui-giong',1);r.onupgradeneeded=()=>r.result.createObjectStore('clips');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}})}
function recLoad(){return recDB().then(db=>new Promise(ok=>{const t=db.transaction('clips').objectStore('clips');const q=t.openCursor();Object.keys(REC).forEach(k=>REC[k]=[]);
  q.onsuccess=()=>{const c=q.result;if(c){const g=c.key.split(':')[0];if(REC[g])REC[g].push(URL.createObjectURL(c.value));c.continue()}else ok()};q.onerror=()=>ok()})).catch(()=>{})}
recLoad();
function playClip(group,then){if(!voiceOn||!REC[group]||!REC[group].length){then&&then();return false}try{if(_aud)_aud.pause();_aud=new Audio(REC[group][rand(REC[group].length)]);_aud.onended=()=>then&&then();_aud.play().catch(()=>then&&then())}catch(e){then&&then();return false}return true}
function cute(t){return t.replace(/\s*\.\s+/g,'. ').replace(/!/g,'!')}
const _SS=('speechSynthesis' in window)?speechSynthesis:null;
function _speakQ(list){if(!_SS)return;try{_SS.cancel();list.forEach(u=>_SS.speak(u))}catch(e){}}
function tts(vi,en){if(!voiceOn||!_SS)return;const Q=[];
  const L=VS.lang||'vi';if(L==='vi')en='';else if(L==='en'&&en)vi='';
  if(vi){(vi.match(/[^.!?]+[.!?]*/g)||[]).map(x=>x.trim()).filter(Boolean).forEach((part,i)=>{const u=new SpeechSynthesisUtterance(cute(part));u.lang='vi-VN';const v=pickVoice('vi');if(v)u.voice=v;
    const ex=/!$/.test(part);u.rate=VS.rate*(ex?1.04:1);u.pitch=Math.min(2,VS.pitch*(ex?1.08:1));u.volume=1;Q.push(u)})}
  if(en){const v=pickVoice('en');(enFix(en).match(/[^.!?]+[.!?]*/g)||[]).map(x=>x.trim()).filter(Boolean).forEach(part=>{const e=new SpeechSynthesisUtterance(part);e.lang=v?v.lang:'en-US';if(v)e.voice=v;e.rate=Math.max(.75,Math.min(1,VS.rate*1.02));e.pitch=Math.max(1,Math.min(1.25,VS.pitch*.85));e.volume=1;Q.push(e)})}
  if(window._ttsExtra){Q.push(window._ttsExtra);window._ttsExtra=null}
  _speakQ(Q)}
const PRAISE_RE=/^(Giỏi quá|Đúng rồi|Tuyệt vời|Bé giỏi lắm|Tuyệt|Hoan hô|Nhăm nhăm|Nở rồi|Hiện ra rồi)[!.,]?\s*/;
const WRONG_RE=/^(Chưa đúng[^.!]*|Chưa phải[^.!]*|Chưa khớp[^.!]*|Ồ, chưa đúng|Không vừa rồi)[.!,]?\s*/;
function say(vi,en){if(!voiceOn)return;if(_aud){try{_aud.pause()}catch(e){}}
  if(vi&&REC.khen.length&&PRAISE_RE.test(vi)){if('speechSynthesis' in window)speechSynthesis.cancel();const rest=vi.replace(PRAISE_RE,'');playClip('khen',()=>tts(rest,en));return}
  if(vi&&REC.dong.length&&WRONG_RE.test(vi)){if('speechSynthesis' in window)speechSynthesis.cancel();const rest=vi.replace(WRONG_RE,'');playClip('dong',()=>tts(rest,en));return}
  tts(vi,en)}
const LANGS=[['vi','🇻🇳','Tiếng Việt'],['en','🇬🇧','English'],['both','🇻🇳🇬🇧','Việt + Anh']];
function saveVS(){try{localStorage.setItem(VSET_KEY,JSON.stringify(VS))}catch(e){}}
function setupLangBtn(vb){if(!vb||document.getElementById('langBtn'))return;const b=document.createElement('button');b.id='langBtn';b.className='ibtn';b.style.width='auto';b.style.padding='0 12px';b.style.font="800 15px 'Nunito',sans-serif";b.style.gap='6px';b.style.display='flex';b.style.color='#1F2A44';b.style.alignItems='center';
  const r=()=>{const l=LANGS.find(x=>x[0]===(VS.lang||'vi'))||LANGS[0];b.innerHTML='<span style="font-size:22px">'+l[1]+'</span><span class="lt-name">'+l[2]+'</span>';b.title='Ngôn ngữ đọc: '+l[2]+' (bấm để đổi)'};r();
  b.onclick=()=>{const i=LANGS.findIndex(x=>x[0]===(VS.lang||'vi'));VS.lang=LANGS[(i+1)%LANGS.length][0];saveVS();r();
    if(VS.lang==='vi')tts('Bé nghe tiếng Việt nhé');else if(VS.lang==='en')tts('','Now in English!');else tts('Tiếng Việt và','English')};
  vb.parentNode.insertBefore(b,vb)}
function setupVoiceBtn(){const b=document.getElementById('voiceBtn');if(!b)return;setupLangBtn(b);const r=()=>{b.textContent=voiceOn?'🔊':'🔇';b.classList.toggle('off',!voiceOn);b.title=voiceOn?'Tắt tiếng':'Bật tiếng'};r();b.onclick=()=>{voiceOn=!voiceOn;try{localStorage.setItem(VOICE_KEY,voiceOn?'1':'0')}catch(e){}if(!voiceOn&&'speechSynthesis' in window)speechSynthesis.cancel();r()}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rand(n){return Math.floor(Math.random()*n)}
function confetti(){const em=['🦕','🦖','🥚','🌴','⭐','🎉','🌟','💖'];for(let i=0;i<26;i++){const s=document.createElement('span');s.className='confetti';s.textContent=em[rand(em.length)];s.style.left=rand(100)+'vw';s.style.animationDelay=(Math.random()*0.8)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3200)}}
function toast(html,ms){const t=document.createElement('div');t.className='toast';t.innerHTML=html;document.body.appendChild(t);if(ms)setTimeout(()=>t.remove(),ms);return t}
const PRAISE=[['Giỏi quá!','Great job!'],['Đúng rồi!','Well done!'],['Tuyệt vời!','Awesome!'],['Bé giỏi lắm!','Super!']];
const NUM_VI=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín','mười'];
const NUM_EN=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
document.addEventListener('DOMContentLoaded',setupVoiceBtn);
/* ===== Âm thanh & hiệu ứng vui nhộn ===== */
let _ac=null,_lastSfx=0,_lx=innerWidth/2,_ly=innerHeight/2;
function _ctx(){if(!_ac){try{_ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(_ac&&_ac.state==='suspended')_ac.resume();return _ac}
function _note(f,t,d,type,vol,slide){const a=_ctx();if(!a||!voiceOn)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,a.currentTime+t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+t+d);
  g.gain.setValueAtTime(0,a.currentTime+t);g.gain.linearRampToValueAtTime(vol||.22,a.currentTime+t+.015);g.gain.exponentialRampToValueAtTime(.0008,a.currentTime+t+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+d+.05)}
const sfx={
  ok(){[784,988,1319].forEach((f,i)=>_note(f,i*.08,.28,'triangle',.22));_note(2093,.24,.35,'sine',.08)},
  no(){_note(330,0,.18,'sine',.2,260);_note(262,.17,.28,'sine',.18,200)},
  tap(){_note(1200,0,.05,'sine',.07,900)},
  pop(){_note(500,0,.12,'square',.08,1400);_note(1800,.03,.06,'sine',.06)},
  flip(){_note(400,0,.12,'sine',.09,800)},
  win(){const m=[523,659,784,1047,784,1047,1319];m.forEach((f,i)=>_note(f,i*.11,i===m.length-1?.6:.18,'triangle',.2));[262,330,392].forEach(f=>_note(f,.66,.7,'sine',.07))}};
function burst(x,y,set,n){set=set||['⭐','✨','💖','🌟','🥚'];for(let i=0;i<(n||9);i++){const s=document.createElement('span');s.className='fx';s.textContent=set[rand(set.length)];const a=Math.random()*Math.PI*2,r=60+Math.random()*90;

const T=[['🦕','khủng long','dinosaur'],['🦖','khủng long bạo chúa','T-rex'],['🥚','quả trứng','egg'],['🐘','con voi','elephant'],['🐶','con chó','dog'],['🍎','quả táo','apple'],['🐟','con cá','fish'],['🌳','cái cây','tree'],['🎈','bóng bay','balloon'],['🐢','con rùa','turtle'],['🚗','ô tô','car'],['⭐','ngôi sao','star'],['🐥','gà con','chick']];
let stars=0,busy=false,qv='',qen='';
function ask(){say(qv,qen)}
document.getElementById('again').onclick=ask;
function round(){busy=false;const t=T[rand(T.length)];const kind=rand(4);const o=document.getElementById('opts');o.innerHTML='';let opts,ans;
  if(kind<2){const sizes=shuffle([60,110,170]).slice(0,3);o.style.gridTemplateColumns='repeat(3,minmax(0,1fr))';const big=kind===0;
    ans=sizes.indexOf(big?Math.max(...sizes):Math.min(...sizes));qv=(big?'Chạm vào ':'Chạm vào ')+t[1]+(big?' to nhất':' nhỏ nhất');qen='Tap the '+(big?'biggest ':'smallest ')+t[2];
    opts=sizes.map(s=>'<span style="font-size:min('+s+'px,'+(s/6.5).toFixed(1)+'vw)">'+t[0]+'</span>')}
  else{const a=1+rand(3),b=a+2+rand(3);const pair=shuffle([a,b]);o.style.gridTemplateColumns='repeat(2,minmax(0,1fr))';const more=kind===2;
    ans=pair.indexOf(more?b:a);qv='Nhóm nào '+(more?'nhiều':'ít')+' '+t[1]+' hơn?';qen='Which group has '+(more?'more':'fewer')+'?';
    opts=pair.map(n=>('<span style="font-size:64px">'+t[0]+'</span>').repeat(n))}
  document.getElementById('qv').textContent=qv;document.getElementById('qe').textContent=qen;
  opts.forEach((h,i)=>{const d=document.createElement('div');d.className='opt';d.innerHTML=h;d.onclick=()=>{if(busy)return;
    if(i===ans){busy=true;d.classList.add('ok');stars++;document.getElementById('stat').textContent='⭐ '+stars;const p=PRAISE[rand(PRAISE.length)];say(p[0],p[1]);if(stars%5===0)confetti();setTimeout(round,2000)}
    else{d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');say('Chưa đúng, bé nhìn kỹ lại nhé','Not quite. Look again!')}};o.appendChild(d)});
  setTimeout(ask,250)}
document.getElementById('stat').textContent='⭐ 0';round();
