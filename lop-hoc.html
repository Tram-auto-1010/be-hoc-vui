<body>
<header class="bar"><a class="ibtn" href="index.html" title="Về trang chính">🏠</a><h1>My English Class <small>Lớp tiếng Anh của bé · 10 topics</small></h1><button class="ibtn" id="voiceBtn">🔊</button></header>
<main>
  <div class="units" id="units"></div>
  <div class="modes"><div class="grp"><button class="btn" id="mLearn">📖 Học<span class="en"> · Learn</span></button><button class="btn ghost" id="mQuiz">👂 Nghe chọn<span class="en"> · Play</span></button></div><span class="stars" id="stat">⭐ 0</span></div>
  <div id="stage"></div>
</main>
<script>
const VOICE_KEY='bhv-voice';
let voiceOn=true;try{voiceOn=localStorage.getItem(VOICE_KEY)!=='0'}catch(e){}
/* ===== Giọng đọc: chọn giọng hay nhất + giọng ba mẹ thu sẵn ===== */
const VSET_KEY='bhv-voiceset';let VS={vi:'',en:'',pitch:1.3,rate:.88,mode:'mix',lang:'vi'};try{Object.assign(VS,JSON.parse(localStorage.getItem(VSET_KEY)||'{}'))}catch(e){}
const NICE=/Natural|Online|Neural|Premium|Enhanced|HoaiMy|Hoài|NamMinh|Linh|Google|Siri|Samantha|Jenny|Aria|Ana/i;
function voicesFor(lang){if(!('speechSynthesis' in window))return [];return speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().replace('_','-').startsWith(lang))}
const NOVELTY=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Grandma|Grandpa|Rocko|Shelley|Flo|Eddy|Reed|Sandy/i;
function enScore(v){const l=(v.lang||'').toLowerCase().replace('_','-'),n=v.name;const acc=VS.enAcc||'us';let s=0;
  if(NOVELTY.test(n))s-=200;
  if(l==='en-us')s+=100;else if(l==='en-gb')s-=40;else s-=60;

 {id:'col',ico:'🎨',t:'Colors',items:[['#E53935','red','màu đỏ'],['#1E88E5','blue','xanh dương'],['#FDD835','yellow','màu vàng'],['#43A047','green','xanh lá'],['#FB8C00','orange','màu cam'],['#8E24AA','purple','màu tím'],['#EC407A','pink','màu hồng'],['#6D4C41','brown','màu nâu'],['#212121','black','màu đen'],['#FFFFFF','white','màu trắng']].map(([c,w,vi])=>I(BLOB(c),w,vi,"It's "+w+'!',['Find '+w+'!','Where is '+w+'?','Which one is '+w+'?'][rand(3)]))},
 {id:'feel',ico:'😊',t:'Feelings',items:[
   I(E('😊'),'happy','vui','I am happy!','Who is happy?'),
   I(E('😢'),'sad','buồn','I am sad.','Who is sad?'),
   I(E('😠'),'angry','tức giận','I am angry!','Who is angry?'),
   I(E('😨'),'scared','sợ hãi','I am scared!','Who is scared?'),
   I(E('😴'),'tired','mệt, buồn ngủ','I am tired.','Who is tired?'),
   I(E('😲'),'surprised','ngạc nhiên','I am surprised!','Who is surprised?'),
   I(E('🤩'),'excited','háo hức','I am excited!','Who is excited?'),
   I(E('😋'),'hungry','đói bụng','I am hungry!','Who is hungry?')],
  intro:'How do you feel?'},
 {id:'act',ico:'🏃',t:'Actions',items:[
   I(ACT('run','💨'),'run','chạy','I can run! Run, run, run!','Who is running?'),
   I(ACT('dance','🎵'),'dance','nhảy múa','I can dance! Dance, dance, dance!','Who is dancing?'),
   I(ACT('crawl'),'crawl','bò','I can crawl! Crawl, crawl, crawl!','Who is crawling?'),
   I(ACT('kick','⚽'),'kick','đá bóng','I can kick! Kick the ball!','Who is kicking?'),
   I(ACT('jump'),'jump','nhảy lên','I can jump! Jump, jump, jump!','Who is jumping?'),
   I(ACT('clap'),'clap','vỗ tay','I can clap! Clap your hands!','Who is clapping?'),
   I(ACT('walk'),'walk','đi bộ','I can walk! Walk, walk, walk!','Who is walking?'),
   I(ACT('swim','🌊'),'swim','bơi','I can swim! Swim, swim, swim!','Who is swimming?')],
  intro:"Let's move!"},
 {id:'fam',ico:'👪',t:'Family',items:[
   I(E('👩'),'mother','mẹ','This is my mother. I love my mother!','Where is the mother?'),
   I(E('👨'),'father','bố','This is my father. I love my father!','Where is the father?'),
   I(E('👶'),'baby','em bé','This is the baby.','Where is the baby?'),
   I(E('👦'),'brother','anh, em trai','This is my brother.','Where is the brother?'),
   I(E('👧'),'sister','chị, em gái','This is my sister.','Where is the sister?'),
   I(E('👵'),'grandmother','bà','This is my grandmother.','Where is the grandmother?'),
   I(E('👴'),'grandfather','ông','This is my grandfather.','Where is the grandfather?'),
   I(WIMG.family?'<div style="width:100%;height:100%">'+wimg('family')+'</div>':'<span class="em fam">👨👩👧</span>','family','gia đình','This is my family. I love my family!','Where is the family?')],
  intro:'This is my family.'}];
const PIC=it=>(WIMG[it.w]&&U.id!=='act')?'<div style="width:100%;height:100%">'+wimg(it.w)+'</div>':(U.id==='fam'&&KID_POSES[it.w])?'<div style="width:100%;height:100%">'+KID(it.w)+'</div>':it.p;
/* ---------- state ---------- */
let U=UNITS[0],mode='learn',idx=0,stars=0,busy=false,target=null,last=null,timers=[];
try{const s=JSON.parse(localStorage.getItem('bhv-class')||'{}');U=UNITS.find(u=>u.id===s.u)||U;if(s.m)mode=s.m}catch(e){}
function remember(){try{localStorage.setItem('bhv-class',JSON.stringify({u:U.id,m:mode}))}catch(e){}}
const stage=document.getElementById('stage');
function later(f,ms){timers.push(setTimeout(f,ms))}
function clearT(){timers.forEach(clearTimeout);timers=[];busy=false;try{speechSynthesis.cancel()}catch(e){}}
const ub=document.getElementById('units');
UNITS.forEach(u=>{const b=document.createElement('button');b.className='btn ghost';b.dataset.u=u.id;b.textContent=u.ico+' '+u.t;b.onclick=()=>{U=u;idx=0;remember();paint()};ub.appendChild(b)});
document.getElementById('mLearn').onclick=()=>{mode='learn';remember();paint()};
document.getElementById('mQuiz').onclick=()=>{mode='quiz';remember();paint()};
function paint(){clearT();ub.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.u===U.id));
  document.getElementById('mLearn').className='btn'+(mode==='learn'?'':' ghost');document.getElementById('mQuiz').className='btn'+(mode==='quiz'?'':' ghost');
  const on=ub.querySelector('.on');if(on&&on.scrollIntoView)try{on.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})}catch(e){}
  if(U.special==='oc')return mode==='learn'?learnOC():quizOC();
  if(U.special==='hello')return mode==='learn'?learnHello():quizHello();
  return mode==='learn'?learn():quiz()}
function win(el){stars++;document.getElementById('stat').textContent='⭐ '+stars;good(el);if(stars%5===0)later(confetti,600)}
const YAY=['Yes!','Great job!','Well done!','Super!','Good job!'];
/* ---------- generic learn ---------- */
function learn(){const its=U.items;idx=(idx+its.length)%its.length;const it=its[idx];
  stage.innerHTML='<div class="learn"><button class="btn nav" id="pv">◀</button><div class="big pop" id="card"><div class="pic">'+(U.special==='num'?'<span class="num">'+(idx+1)+'</span>':PIC(it))+'</div><div class="word">'+it.w+'</div><div class="vi">'+it.vi+'</div>'+(it.s?'<div class="sent">'+it.s+'</div>':'')+'<div id="cnt"></div></div><button class="btn nav" id="nx">▶</button></div><div class="dots">'+its.map((_,i)=>'<b class="'+(i===idx?'on':'')+'" data-i="'+i+'"></b>').join('')+'</div><p class="hint">Chạm vào thẻ để nghe lại · Bấm ▶ để sang từ tiếp. '+(U.intro?'Câu ở lớp: “'+U.intro+'”':'')+'</p>';
  document.getElementById('pv').onclick=()=>{idx--;learn()};document.getElementById('nx').onclick=()=>{idx++;learn()};
  stage.querySelectorAll('.dots b').forEach(d=>d.onclick=()=>{idx=+d.dataset.i;learn()});
  const card=document.getElementById('card');card.onclick=()=>speakLearn(it,true);sfx.flip&&sfx.flip();speakLearn(it,false)}
function speakLearn(it,again){if(U.special==='num'){const n=idx+1,cnt=document.getElementById('cnt');cnt.innerHTML='';clearT();
    let t='';for(let i=1;i<=n;i++)t+=NUM_EN[i]+'. ';sayEN(t+'Number '+it.w+'!',it.vi);
    for(let i=0;i<n;i++)later(()=>{const box=cnt.querySelector('.eggs')||(cnt.innerHTML=EGGS(0,1),cnt.querySelector('.eggs'));const s=document.createElement('span');s.textContent='🥚';box.appendChild(s)},300+i*620);return}
  sayEN(((!again&&U.intro&&idx===0)?U.intro+' ':'')+it.w+'! '+it.s,it.vi)}
/* ---------- generic quiz ---------- */
function quiz(){busy=false;let pool=U.items;let eggs=false;
  if(U.special==='num'&&Math.random()<.45){pool=pool.slice(0,5);eggs=true}
  let set=shuffle(pool).slice(0,4);target=set[rand(set.length)];if(target===last&&set.length>1){target=set.find(x=>x!==last)}last=target;
  const q=eggs?'How many eggs? Find '+target.w+' eggs!':target.q;
  stage.innerHTML='<div class="ask"><span class="teach">🦕</span><div class="bub" id="bub"><span>'+q+'</span><small>🔈 Chạm để nghe lại · Tap to listen</small></div></div><div class="grid" id="grid"></div>';
  const g=document.getElementById('grid');const ask=()=>sayEN(q);document.getElementById('bub').onclick=ask;
  set.forEach(it=>{const b=document.createElement('button');b.className='c';const n=U.items.indexOf(it)+1;
    b.innerHTML='<div class="pic">'+(eggs?EGGS(n):PIC(it))+'</div><i>'+it.w+'</i>';
    b.onclick=()=>{if(busy){sayEN(it.w);return}
      if(it===target){busy=true;b.classList.add('ok');win(b);sayEN(YAY[rand(YAY.length)]+' '+(U.special==='num'?'Number '+it.w+'!':it.s||it.w),it.vi);
        later(()=>g.querySelectorAll('.c').forEach(x=>x.classList.add('show')),400);later(quiz,3600)}
      else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.classList.add('show');bad(b);sayEN(it.w+'! Try again. '+q)}};
    g.appendChild(b)});
  later(ask,250)}
/* ---------- open / close ---------- */
const obj=k=>(k==='eyes'||k==='mouth'?'your ':'the ')+k;
const isAre=k=>k==='eyes'?'are':'is';
function learnOC(){const its=U.items;idx=(idx+its.length)%its.length;const [k,vi]=its[idx];let open=false,step=0;
  stage.innerHTML='<div class="ask"><span class="teach">🦕</span><div class="bub" id="bub"><span id="cmd"></span><small>🔈 Chạm để nghe lại · Tap to listen</small></div></div><div class="learn"><button class="btn nav" id="pv">◀</button><div class="big" id="card"><div class="pic" id="pic"></div><div class="word" id="wd"></div><div class="vi">'+vi+' · mở / đóng</div></div><button class="btn nav" id="nx">▶</button></div><p class="hint">Dino ra lệnh “Open…/Close…”, bé chạm vào hình để mở hoặc đóng.</p>';
  const pic=document.getElementById('pic'),wd=document.getElementById('wd'),cmd=document.getElementById('cmd');
  const draw=()=>{pic.innerHTML=OC(k,open);pic.classList.remove('pop');void pic.offsetWidth;pic.classList.add('pop');wd.textContent=open?'open':'closed'};
  const command=()=>{const c=(open?'Close ':'Open ')+obj(k)+'!';cmd.textContent=c;sayEN(c)};
  draw();command();
  document.getElementById('bub').onclick=command;
  document.getElementById('card').onclick=()=>{if(busy)return;busy=true;open=!open;draw();sfx.pop&&sfx.pop();step++;
    const msg=(k==='eyes'||k==='mouth'?'Your ':'The ')+k+' '+isAre(k)+' '+(open?'open':'closed')+'!';
    if(step%2===0){win(document.getElementById('card'))}
    sayEN((step%2===0?'Good job! ':'')+msg,open?'mở rồi':'đóng rồi');later(()=>{busy=false;if(step>=2&&step%2===0){idx++;later(learnOC,400)}else command()},2000)};
  document.getElementById('pv').onclick=()=>{clearT();idx--;learnOC()};document.getElementById('nx').onclick=()=>{clearT();idx++;learnOC()}}
function quizOC(){busy=false;const [k]=U.items[rand(U.items.length)];const want=Math.random()<.5;const q='Which one is '+(want?'open':'closed')+'?';
  stage.innerHTML='<div class="ask"><span class="teach">🦕</span><div class="bub" id="bub"><span>'+q+'</span><small>🔈 Chạm để nghe lại · Tap to listen</small></div></div><div class="grid two" id="grid"></div>';
  const g=document.getElementById('grid');const ask=()=>sayEN(q);document.getElementById('bub').onclick=ask;
  shuffle([true,false]).forEach(o=>{const b=document.createElement('button');b.className='c';b.innerHTML='<div class="pic">'+OC(k,o)+'</div><i>'+(o?'open':'closed')+'</i>';
    b.onclick=()=>{if(busy)return;if(o===want){busy=true;b.classList.add('ok');win(b);g.querySelectorAll('.c').forEach(x=>x.classList.add('show'));sayEN(YAY[rand(YAY.length)]+' '+(k==='eyes'||k==='mouth'?'Your ':'The ')+k+' '+isAre(k)+' '+(o?'open':'closed')+'.',o?'mở':'đóng');later(quizOC,3200)}
      else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');bad(b);sayEN('No, this one is '+(o?'open':'closed')+'. '+q)}};g.appendChild(b)});
  later(ask,250)}
/* ---------- hello / goodbye ---------- */
const FRIENDS=[['🐻','Bear'],['🐰','Rabbit'],['🐼','Panda'],['🦊','Fox'],['🐸','Frog'],['🐵','Monkey'],['🦁','Lion'],['🐷','Pig']];
function sceneHTML(f,arrive){return '<div class="scene"><span class="sky">'+(arrive?'☀️':'🌇')+'</span><span class="place">'+(arrive?'🏫':'🏠')+'</span><span class="fr '+(arrive?'out':'')+'" id="fr">'+f[0]+'<span class="w" hidden>👋</span></span><div class="sb" id="sb"></div></div>'}
const ANS='<div class="answers"><button class="btn hi" data-a="hello">👋 Hello!</button><button class="btn hi" data-a="hi">🙌 Hi!</button><button class="btn bye" data-a="bye">👋 Goodbye!</button></div>';
const WORD={hello:'Hello!',hi:'Hi!',bye:'Goodbye!'};
function learnHello(){const f=FRIENDS[idx%FRIENDS.length];
  stage.innerHTML=sceneHTML(f,true)+ANS+'<div class="answers"><button class="btn ghost" id="again">🔁 Xem lại · Again</button><button class="btn ghost" id="nx">▶ Bạn khác · Next friend</button></div><p class="hint">Gặp bạn thì nói <b>Hello / Hi</b>, chia tay thì nói <b>Goodbye</b>. Bấm nút để nghe.</p>';
  const fr=document.getElementById('fr'),sb=document.getElementById('sb'),w=fr.querySelector('.w');
  const bubble=t=>{sb.textContent=t;sb.classList.add('on');w.hidden=false};
  requestAnimationFrame(()=>requestAnimationFrame(()=>fr.classList.remove('out')));
  later(()=>{bubble('Hello! Hi!');sayEN("Hello! Hi! I'm "+f[1]+'.','Xin chào')},2200);
  later(()=>{sb.classList.remove('on');w.hidden=true},5600);
  later(()=>{bubble('Goodbye! Bye bye!');sayEN('Goodbye! Bye bye!','Tạm biệt');stage.querySelector('.place').textContent='🏠';stage.querySelector('.sky').textContent='🌇'},6400);
  later(()=>fr.classList.add('away'),8200);
  stage.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{sayEN(WORD[b.dataset.a]);sfx.tap&&sfx.tap()});
  document.getElementById('again').onclick=()=>{clearT();learnHello()};document.getElementById('nx').onclick=()=>{clearT();idx++;learnHello()}}
function quizHello(){busy=false;const f=FRIENDS[rand(FRIENDS.length)];const arrive=Math.random()<.55;
  stage.innerHTML=sceneHTML(f,arrive)+ANS+'<p class="hint">'+(arrive?'Bạn đến lớp':'Bạn đi về nhà')+' – bé nói gì nhỉ? 🔈 Chạm vào bạn để nghe lại.</p>';
  const fr=document.getElementById('fr'),sb=document.getElementById('sb'),w=fr.querySelector('.w');
  const q=arrive?'Look! '+f[1]+' is here. What do you say?':f[1]+' is going home. What do you say?';
  fr.onclick=()=>sayEN(q);
  if(arrive)requestAnimationFrame(()=>requestAnimationFrame(()=>fr.classList.remove('out')));else{w.hidden=false}
  later(()=>sayEN(q),arrive?1600:300);
  stage.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(busy)return;const a=b.dataset.a;const ok=arrive?a!=='bye':a==='bye';
    if(ok){busy=true;sb.textContent=WORD[a];sb.classList.add('on');w.hidden=false;win(b);sayEN((arrive?WORD[a].replace('!','')+', '+f[1]+'!':'Goodbye, '+f[1]+'! Bye bye!')+' '+YAY[rand(YAY.length)],arrive?'Xin chào':'Tạm biệt');
      if(!arrive)later(()=>fr.classList.add('away'),900);later(quizHello,4200)}
    else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');bad(b);sayEN(WORD[a]+' Hmm. '+q)}})}
paint();
</script>
